services:
  - type: web
    name: kurippu-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: JWT_SECRET
        value: kurippu-production-secure-jwt-secret-key-2026-turn-docs-into-actions
      - key: AI_PROVIDER
        value: mock
